<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>
    <script src="scripts/dragdrop.js" defer></script>
    <link rel="stylesheet" href="styles/dragdrop.css">
</head>

<body>
    <main>
        <section>
            <h1>Drag and Drop</h1>
            <div class="content">

                <div class="container">
                    <div class="list-item" id="1" draggable="true">
                        <h3>List Item 1</h3>
                    </div>
                    <div class="list-item" id="2" draggable="true">
                        <h3>List Item 2</h3>
                    </div>
                    <div class="list-item" id="4" draggable="true">
                        <h3>List Item 4</h3>
                    </div>
                    <div class="list-item" id="5" draggable="true">
                        <h3>List Item 5</h3>
                    </div>
                </div>
                <div class="container">
                    <div class="list-item" id="3" draggable="true">
                        <h3>List Item 3</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
