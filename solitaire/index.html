<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/solitaire.js" defer></script>
</head>

<body>
    <main>
        <section class="game">
            <div class="foundation-hand-area">
                <div class="foundation-piles">
                    <div class="column foundation"></div>
                    <div class="column foundation"></div>
                    <div class="column foundation"></div>
                    <div class="column foundation"></div>
                </div>
                <div class="hand">
                    <div class="column" id="waste"></div>
                    <div class="column" id="stock"></div>
                </div>
            </div>
            <div class="tableau">
                <div class="column tableau-column"></div>
                <div class="column tableau-column"></div>
                <div class="column tableau-column"></div>
                <div class="column tableau-column"></div>
                <div class="column tableau-column"></div>
                <div class="column tableau-column"></div>
                <div class="column tableau-column"></div>
            </div>
        </section>
    </main>
</body>

</html>
